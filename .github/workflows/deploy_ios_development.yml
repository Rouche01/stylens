name: Deploy iOS to Development
on:
    workflow_dispatch:
        inputs:
            version:
                description: "App Version (e.g. 1.0.0)"
                required: true
                default: "1.0.0"
            build:
                description: "Build Number (e.g. 42)"
                required: true
                default: "1"
            groups:
                description: "Firebase Tester Groups"
                required: true
                default: "gostylens-vanguards"
            release_notes:
                description: "Release Notes (leave blank to use the latest commit message)"
                required: false
                default: ""
            testers:
                description: "Firebase Testers (optional)"
                required: false
                default: ""
            env:
                description: "Environment (staging or production)"
                required: true
                default: "staging"

permissions:
  contents: read

jobs:
    deployIOSDevelopment:
        runs-on: macos-latest
        env:
            APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
            FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

        steps:

            # v4.2.2
            - name: Checkout repository
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

            # v2.18.0
            - name: Flutter setup
              uses: subosito/flutter-action@f2c4f6686ca8e8d6e6d0f28410eeef506ed66aff
              with:
                channel: "stable"
                cache: true
              id: flutter

            - name: Accept Xcode License
              run: sudo xcodebuild -license accept

            - name: Setup Environment Files
              env:
                ENV_STAGING_FILE: ${{ secrets.ENV_STAGING_FILE }}
                STG_IOS_GOOGLE_SERVICE_INFO: ${{ secrets.STG_IOS_GOOGLE_SERVICE_INFO }}
              run: |
                echo "$ENV_STAGING_FILE" > .env.staging
                echo "$STG_IOS_GOOGLE_SERVICE_INFO" > ios/Runner/GoogleService-Info.plist
                touch .env.development
                touch .env.production

            - name: Get packages
              run: flutter pub get
              
            - name: Generate Xcode Config
              run: flutter build ios --config-only
              
            # v4.3.0
            - name: Cache Pods
              uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
              with:
                path: ios/Pods
                key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
                restore-keys: |
                  ${{ runner.os }}-pods-

            - name: Install CocoaPods
              run: |
                cd ios
                pod install
              
            # v1.310.0
            - name: Setup Fastlane
              uses: ruby/setup-ruby@afeafc3d1ab54a631816aba4c914a0081c12ff2f
              with:
                ruby-version: "3.3"
                bundler-cache: true
                working-directory: ios

            - name: Set up Firebase authentication
              run: echo "${FIREBASE_SERVICE_ACCOUNT}" > ./ios/fastlane/service-account.json

            - name: Build and Deploy to Firebase App Distribution
              env:
                MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
                MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
                VERSION: ${{ github.event.inputs.version }}
                BUILD_NUMBER: ${{ github.event.inputs.build }}
                RELEASE_NOTES: ${{ github.event.inputs.release_notes }}
                GROUPS: ${{ github.event.inputs.groups }}
                TESTERS: ${{ github.event.inputs.testers }}
                ENV: ${{ github.event.inputs.env }}
              run: |
                ACTUAL_RELEASE_NOTES="$RELEASE_NOTES"
                if [ -z "$ACTUAL_RELEASE_NOTES" ]; then
                  ACTUAL_RELEASE_NOTES=$(git log -1 --pretty=%B)
                fi
                cd ./ios
                bundle exec fastlane ios development \
                  version:"$VERSION" \
                  build_number:"$BUILD_NUMBER" \
                  release_notes:"$ACTUAL_RELEASE_NOTES" \
                  groups:"$GROUPS" \
                  testers:"$TESTERS" \
                  env:"$ENV"
            - name: Print Fastlane Build Logs
              if: failure()
              run: cat ~/Library/Logs/gym/Runner-Runner.log || true

            # v4.6.2
            - name: Upload Fastlane Build Logs
              if: failure()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
              with:
                name: fastlane-build-logs
                path: ~/Library/Logs/gym/*.log