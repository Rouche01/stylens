name: Deploy iOS to Development
on:
    workflow_dispatch:
        inputs:
            version:
                description: "App Version (e.g. 1.0.0)"
                required: true
                default: "1.0.0"
            build:
                description: "Build Number (e.g. 42)"
                required: true
                default: "1"
            groups:
                description: "Firebase Tester Groups"
                required: true
                default: "GoStylens Vanguards"
            release_notes:
                description: "Release Notes"
                required: true
                default: "Initial iOS Release"
            testers:
                description: "Firebase Testers (optional)"
                required: false
                default: ""
            env:
                description: "Environment (staging or production)"
                required: true
                default: "staging"

jobs:
    deployIOSDevelopment:
        runs-on: macos-latest
        env:
            APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
            FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

        steps:
            - name: Select Xcode 16.2
              run: sudo xcode-select -s /Applications/Xcode_16.2.app

            - name: List Xcode installations
              run: ls -1 /Applications | grep Xcode

            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Flutter setup
              uses: subosito/flutter-action@v2
              with:
                channel: "stable"
                cache: true
              id: flutter

            - name: Accept Xcode License
              run: sudo xcodebuild -license accept

            - name: Get packages
              run: flutter pub get
            - name: Cache Pods
              uses: actions/cache@v4
              with:
                path: ios/Pods
                key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
                restore-keys: |
                  ${{ runner.os }}-pods-

            - name: Install CocoaPods
              run: |
                cd ios
                pod install
              
            - name: Setup Fastlane
              uses: ruby/setup-ruby@v1
              with:
                ruby-version: "3.3"
                bundler-cache: true
                working-directory: ios

            - name: Set up Firebase authentication
              run: echo "${FIREBASE_SERVICE_ACCOUNT}" > ./ios/fastlane/service-account.json

            - name: Build and Deploy to Firebase App Distribution
              env:
                MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
                MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
                FLUTTER_ROOT: ${{ steps.flutter.outputs.flutter-root }}
              run: |
                cd ./ios
                bundle exec fastlane ios development \
                  version:${{ github.event.inputs.version }} \
                  build_number:${{ github.event.inputs.build }} \
                  release_notes:"${{ github.event.inputs.release_notes }}" \
                  groups:"${{ github.event.inputs.groups }}" \
                  testers:"${{ github.event.inputs.testers }}" \
                  env:${{ github.event.inputs.env }}

                
            
            