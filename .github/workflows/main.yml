name: Flutter CI Tests
on:
    push:
      branches: 
        - main
    pull_request:
      branches: 
        - main

jobs:
    test:
        name: Run flutter tests
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
            - uses: subosito/flutter-action@v2
              with:
                channel: "stable"
                cache: true
            - run: flutter --version
            - name: Get packages
              run: flutter pub get

            - name: Run tests
              run: flutter test
    