name: Flutter CI Tests
on:
    push:
      branches: 
        - main
    pull_request:
      branches: 
        - main

permissions:
  contents: read

jobs:
    test:
        name: Run flutter tests
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@11bd71901bbe5b16309077ee82733a9c2f6fc311 # v4.2.2
            - uses: subosito/flutter-action@f2c65cce69ca25d10201aa868ed3b30275062a49 # v2.18.0
              with:
                channel: "stable"
                cache: true
            - run: flutter --version
            - name: Get packages
              run: flutter pub get

            - name: Run tests
              run: |
                if [ -d "test" ]; then
                  flutter test
                else
                  echo "No test directory found, skipping tests."
                fi
    