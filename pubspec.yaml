name: gostylens
description: "Your personal stylist on the go."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.0.4
  english_words: ^4.0.0
  provider: ^6.1.5
  http: ^1.5.0
  dio: ^5.8.0
  supabase_flutter: ^2.12.0
  google_sign_in: ^7.2.0
  font_awesome_flutter: ^10.12.0
  flutter_native_splash: ^2.4.7
  flutter_dotenv: ^6.0.0
  purchases_flutter: ^9.13.1
  lottie: ^3.3.2
  intl: ^0.20.2
  url_launcher: ^6.3.2
  sign_in_with_apple: ^6.1.1
  crypto: ^3.0.3
  pinput: ^6.0.2
  pretty_dio_logger: ^1.4.0
  get_it: ^9.2.1
  posthog_flutter: ^5.0.0
  dio_cache_interceptor: ^3.5.1
  dio_cache_interceptor_hive_store: ^4.0.0
  path_provider: ^2.1.5
  flutter_markdown: ^0.7.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  fonts:
    - family: ClashDisplay
      fonts:
        - asset: assets/fonts/ClashDisplay-Regular.otf
        - asset: assets/fonts/ClashDisplay-Medium.otf
          weight: 500
        - asset: assets/fonts/ClashDisplay-Semibold.otf
          weight: 600
        - asset: assets/fonts/ClashDisplay-Bold.otf
          weight: 700
    - family: Metropolis
      fonts:
        - asset: assets/fonts/Metropolis-Regular.otf
        - asset: assets/fonts/Metropolis-Light.otf
          weight: 300
        - asset: assets/fonts/Metropolis-Medium.otf
          weight: 500
        - asset: assets/fonts/Metropolis-Semibold.otf
          weight: 600
        - asset: assets/fonts/Metropolis-Bold.otf
          weight: 700
        - asset: assets/fonts/Metropolis-Black.otf
          weight: 900
  assets:
    - .env.development
    - .env.production
    - assets/icon/
    - assets/animations/
    - assets/imgs/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/icon/icon.png"