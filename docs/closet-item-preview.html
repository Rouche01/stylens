<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stylens — Closet item preview</title>
    <link
      rel="stylesheet"
      href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600,700&f[]=satoshi@400,500,600&display=swap"
    />
    <style>
      :root {
        --green: #3d4a3d;
        --lime: #b8e994;
        --mist: #e8f5e8;
        --ink: #2c352c;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        font-family: Satoshi, Metropolis, system-ui, sans-serif;
        background:
          radial-gradient(1200px 600px at 20% -10%, #d7ecd4 0%, transparent 55%),
          radial-gradient(900px 500px at 100% 100%, #cfe8c8 0%, transparent 50%),
          #dfe9dc;
        color: var(--ink);
      }

      .page {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 36px;
        min-height: 100vh;
        padding: 40px 32px 56px;
      }

      .chrome {
        text-align: center;
        max-width: 52ch;
      }

      .chrome h1 {
        font-family: "Clash Display", sans-serif;
        font-size: 28px;
        font-weight: 600;
        letter-spacing: -0.03em;
        line-height: 1.15;
        color: var(--green);
      }

      .chrome p {
        margin-top: 12px;
        font-size: 14px;
        line-height: 1.5;
        color: #5a675a;
      }

      .chrome .note {
        margin-top: 18px;
        font-size: 12px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #7a8a7a;
      }

      .phones {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 40px 48px;
      }

      .variant {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }

      .variant > span {
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #7a8a7a;
      }

      .phone {
        width: 390px;
        height: 844px;
        background: var(--mist);
        border-radius: 48px;
        padding: 12px;
        box-shadow:
          0 0 0 10px #2a332a,
          0 40px 80px rgba(61, 74, 61, 0.28);
        position: relative;
      }

      .phone-screen {
        height: 100%;
        border-radius: 38px;
        overflow: hidden;
        background: var(--mist);
        display: flex;
        flex-direction: column;
        position: relative;
      }

      .status {
        flex: none;
        height: 52px;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        padding: 0 28px 8px;
        font-size: 14px;
        font-weight: 600;
        color: var(--green);
      }

      .island {
        position: absolute;
        top: 18px;
        left: 50%;
        width: 118px;
        height: 34px;
        transform: translateX(-50%);
        background: #1c221c;
        border-radius: 20px;
      }

      .app {
        flex: 1;
        overflow: auto;
        padding: 0 0 108px;
        scrollbar-width: none;
      }

      .app::-webkit-scrollbar {
        display: none;
      }

      .topbar {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 4px 4px 12px;
      }

      .icon-btn {
        width: 42px;
        height: 42px;
        flex: none;
        border: 0;
        background: transparent;
        color: var(--green);
        display: grid;
        place-items: center;
        cursor: pointer;
      }

      .topbar h2 {
        flex: 1;
        min-width: 0;
        font-family: "Clash Display", sans-serif;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: -0.03em;
        color: var(--green);
        text-align: left;
      }

      .hero {
        position: relative;
        overflow: hidden;
        background: #1c221c;
        aspect-ratio: 3 / 4;
      }

      .hero img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 18%;
      }

      .focus {
        position: absolute;
        left: 24%;
        top: 38%;
        width: 52%;
        height: 48%;
        border: 2px solid color-mix(in srgb, var(--lime) 88%, white);
        border-radius: 14px;
        box-shadow: 0 0 0 200vmax rgba(28, 34, 28, 0.55);
        pointer-events: none;
      }

      .caption {
        color: var(--green);
      }

      .caption strong {
        display: block;
        font-family: "Clash Display", sans-serif;
        font-size: 16px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }

      .caption span {
        display: block;
        margin-top: 2px;
        font-size: 12px;
        font-weight: 500;
        color: color-mix(in srgb, var(--green) 58%, #fff);
      }

      /* A: photo + caption share one rounded silhouette. No mint gap. */
      .hero-flush {
        margin: 0 16px;
        border-radius: 22px;
        overflow: hidden;
        background: color-mix(in srgb, var(--lime) 88%, var(--mist));
        box-shadow: 0 8px 20px color-mix(in srgb, var(--green) 8%, transparent);
      }

      .hero-flush .caption {
        padding: 10px 14px 12px;
        border-top: 1px solid color-mix(in srgb, var(--green) 14%, transparent);
      }

      .panel {
        padding: 18px 16px 0;
      }

      .panel h3 {
        font-family: "Clash Display", sans-serif;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: -0.03em;
        color: var(--green);
      }

      .panel p {
        margin-top: 8px;
        font-size: 14px;
        line-height: 1.45;
        color: color-mix(in srgb, var(--green) 58%, #fff);
      }

      .products {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
        margin-top: 16px;
      }

      .product {
        border: 0;
        padding: 0;
        background: #fff;
        border-radius: 16px;
        overflow: hidden;
        cursor: pointer;
        box-shadow: 0 8px 20px color-mix(in srgb, var(--green) 8%, transparent);
      }

      .product img {
        display: block;
        width: 100%;
        aspect-ratio: 4 / 5;
        object-fit: cover;
        background: #eef4ee;
      }

      .product figcaption {
        padding: 8px 8px 10px;
        font-size: 11px;
        font-weight: 600;
        color: var(--green);
        text-align: center;
      }

      .product[aria-pressed="true"] {
        outline: 2px solid var(--green);
        outline-offset: 1px;
      }

      .none {
        display: block;
        width: 100%;
        margin-top: 12px;
        height: 44px;
        border-radius: 12px;
        border: 1.5px solid color-mix(in srgb, var(--green) 22%, transparent);
        background: transparent;
        color: var(--green);
        font: 600 15px/1 Satoshi, sans-serif;
        cursor: pointer;
      }

      .dock {
        position: absolute;
        left: 20px;
        right: 20px;
        bottom: 18px;
        height: 64px;
        border-radius: 26px;
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        align-items: center;
        padding: 5px;
        background: linear-gradient(
          180deg,
          color-mix(in srgb, var(--green) 82%, var(--lime)) 0%,
          color-mix(in srgb, var(--green) 92%, black) 100%
        );
        box-shadow: 0 8px 24px rgba(61, 74, 61, 0.28);
      }

      .dock span {
        text-align: center;
        color: rgba(255, 255, 255, 0.7);
        font-size: 10px;
        font-weight: 600;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
      }

      .dock span.active {
        color: var(--green);
        background: color-mix(in srgb, var(--lime) 92%, white);
        border-radius: 20px;
        height: 54px;
        justify-content: center;
      }

      .dock svg {
        width: 22px;
        height: 22px;
      }

      @media (max-width: 860px) {
        .page {
          padding: 24px 16px 40px;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <aside class="chrome">
        <h1>Closet item preview</h1>
        <p>
          Tap a tile and land on the full outfit with this piece boxed. Name
          and “Worn in this outfit” sit in a flush card footer under the photo,
          so they never fight the bounding box.
        </p>
        <p class="note">Flush card — locked. Tap a product to select it</p>
      </aside>
      <div class="phones" id="phones"></div>
    </div>

    <template id="phone-frame">
      <div class="phone">
        <div class="phone-screen">
          <div class="island"></div>
          <div class="status">
            <span>9:41</span>
            <span>●●●</span>
          </div>
          <main class="app">
            <div class="topbar">
              <button class="icon-btn" type="button" aria-label="Back">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                  <path
                    d="M12.5 4.5 7 10l5.5 5.5"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </button>
              <h2>Leather jacket</h2>
              <button class="icon-btn" type="button" aria-label="Edit">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                  <path
                    d="M13.2 4.3a1.5 1.5 0 0 1 2.1 2.1L7.6 14.1 4.5 15l.9-3.1 7.8-7.6Z"
                    stroke="currentColor"
                    stroke-width="1.6"
                    stroke-linejoin="round"
                  />
                  <path
                    d="M4.5 16.2h11"
                    stroke="currentColor"
                    stroke-width="1.6"
                    stroke-linecap="round"
                  />
                </svg>
              </button>
            </div>
            <div data-hero></div>
            <section class="panel">
              <h3>Looks like yours?</h3>
              <p>
                Tap a photo if it’s this jacket. We’ll use it for a cleaner
                presentation, or to try it on your twin.
              </p>
              <div class="products">
                <button class="product" type="button" aria-pressed="false">
                  <img
                    src="https://images.unsplash.com/photo-1551028719-00167b16eac5?auto=format&fit=crop&w=600&q=80"
                    alt=""
                  />
                  <figcaption>Black leather</figcaption>
                </button>
                <button class="product" type="button" aria-pressed="false">
                  <img
                    src="https://images.unsplash.com/photo-1521223890158-f9f7c3d5d504?auto=format&fit=crop&w=600&q=80"
                    alt=""
                  />
                  <figcaption>Moto</figcaption>
                </button>
                <button class="product" type="button" aria-pressed="false">
                  <img
                    src="https://images.unsplash.com/photo-1520975916090-3105956dac38?auto=format&fit=crop&w=600&q=80"
                    alt=""
                  />
                  <figcaption>Biker</figcaption>
                </button>
              </div>
              <button class="none" type="button">None of these</button>
            </section>
          </main>
          <nav class="dock" aria-label="Tabs">
            <span class="active">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path
                  d="M21 6.5c0-1.5-1.6-2.6-3.4-2.1L12 6.2 6.4 4.4C4.6 3.9 3 5 3 6.5V18c0 1.1.9 2 2 2 .3 0 .6-.1.9-.2L12 18l6.1 1.8c.3.1.6.2.9.2 1.1 0 2-.9 2-2V6.5Z"
                />
              </svg>
              Closet
            </span>
            <span>
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path
                  d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Zm8-4.2V9l-2.1-.4a7.2 7.2 0 0 0-.9-2.1L18.2 5 16.8 3.6l-1.5 1.2a7.2 7.2 0 0 0-2.1-.9L12.8 2h-1.6l-.4 2.1a7.2 7.2 0 0 0-2.1.9L7.2 3.6 5.8 5l1.2 1.5a7.2 7.2 0 0 0-.9 2.1L4 9v1.6l2.1.4c.1.7.4 1.5.9 2.1L5.8 14.6 7.2 16l1.5-1.2c.6.5 1.4.8 2.1.9L11.2 18h1.6l.4-2.1c.7-.1 1.5-.4 2.1-.9l1.5 1.2 1.4-1.4-1.2-1.5c.5-.6.8-1.4.9-2.1L20 10.8Z"
                />
              </svg>
              Capture
            </span>
            <span>
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path
                  d="M13 3a9 9 0 1 0 8.5 12h-2.1A7 7 0 1 1 13 5v4.6l3.4 2-1 1.6L11 10V3h2Z"
                />
              </svg>
              History
            </span>
          </nav>
        </div>
      </div>
    </template>

    <script>
      const outfit = `
        <img
          src="https://images.unsplash.com/photo-1487222477894-8943e31ef7b2?auto=format&fit=crop&w=1200&q=80"
          alt="Outfit with leather jacket"
        />
        <div class="focus" aria-hidden="true"></div>
      `;

      const variants = [
        {
          label: "Flush card",
          hero: `
            <div class="hero-flush">
              <div class="hero">${outfit}</div>
              <div class="caption">
                <strong>Leather jacket</strong>
                <span>Worn in this outfit</span>
              </div>
            </div>
          `,
        },
      ];

      const phones = document.getElementById("phones");
      const frame = document.getElementById("phone-frame");

      for (const variant of variants) {
        const figure = document.createElement("figure");
        figure.className = "variant";
        const label = document.createElement("span");
        label.textContent = variant.label;
        figure.append(label);

        const screen = frame.content.cloneNode(true);
        const heroSlot = screen.querySelector("[data-hero]");
        heroSlot.outerHTML = variant.hero;
        figure.append(screen);
        phones.append(figure);
      }

      document.querySelectorAll(".phone").forEach((phone) => {
        const products = phone.querySelectorAll(".product");
        const none = phone.querySelector(".none");
        products.forEach((button) => {
          button.addEventListener("click", () => {
            products.forEach((item) =>
              item.setAttribute("aria-pressed", String(item === button)),
            );
          });
        });
        none.addEventListener("click", () => {
          products.forEach((item) => item.setAttribute("aria-pressed", "false"));
        });
      });
    </script>
  </body>
</html>
